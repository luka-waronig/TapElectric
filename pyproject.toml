[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-charger-scan"
version = "0.1.0"
description = "Reference service for collecting EV charger QR scan data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
ml = [
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "qrcode[pil]>=8,<9",
  "torch>=2.4,<3",
  "transformers>=4.52,<6",
]

[project.scripts]
tap-generate-data = "tap_charger_scan.synthetic:main"
tap-train = "tap_charger_scan.train:main"
tap-evaluate = "tap_charger_scan.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
